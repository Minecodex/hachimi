name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check:prettier
      - run: pnpm typecheck
      - run: pnpm lint:eslint
      - run: pnpm test:node
      - run: pnpm provenance:check
      - run: pnpm release:check-clean

  windows-rust:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:prepare
      - run: pnpm format:check:rust
      - run: pnpm lint:clippy
      - run: pnpm test:rust
      - name: Verify Windows system Git discovery as a standard user
        shell: powershell
        run: ./scripts/ci/run-system-runtime-standard-user.ps1
      - run: pnpm contracts:check
      - run: pnpm test:p0-adversarial
      - run: pnpm release:check-clean

  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hachimi/ui exec playwright install chromium
      - run: pnpm test:packages
      - run: pnpm storybook:build
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-ui-failure
          path: packages/ui/test-results
          retention-days: 7
      - run: pnpm release:check-clean

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:desktop:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-desktop-failure
          path: target/desktop-e2e-artifacts
          retention-days: 7
      - run: pnpm release:check-clean

  windows-non-admin:
    if: ${{ always() }}
    needs: [windows-static, windows-rust, windows-ui, windows-desktop]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Require all parallel Windows checks to pass
        shell: powershell
        run: |
          $results = @(
            '${{ needs.windows-static.result }}',
            '${{ needs.windows-rust.result }}',
            '${{ needs.windows-ui.result }}',
            '${{ needs.windows-desktop.result }}'
          )
          if ($results -contains 'failure' -or $results -contains 'cancelled' -or $results -contains 'skipped') {
            throw "Parallel Windows CI failed: $($results -join ', ')"
          }

  # Minimal macOS (arm64) regression net: native build chain, Rust gates, and
  # the CEF host smoke. Prettier/ESLint/typecheck stay on the Windows job
  # (platform-independent).
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:prepare
      - run: pnpm format:check:rust
      - run: pnpm lint:clippy
      - run: pnpm test:rust
      - run: pnpm test:cef:mac
      - name: Build macOS app system-runtime smoke bundle
        run: corepack pnpm exec tauri build --debug --bundles app --features desktop-e2e --config apps/desktop/src-tauri/tauri.conf.json
      - name: Launch the app bundle with a Finder-equivalent minimal environment
        run: |
          env -i \
            HOME="$HOME" \
            USER="$USER" \
            LOGNAME="$LOGNAME" \
            TMPDIR="$RUNNER_TEMP/" \
            LANG="en_US.UTF-8" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            target/debug/bundle/macos/Hachimi.app/Contents/MacOS/hachimi-desktop \
            --system-runtime-smoke
      - name: Launch the app bundle through the Apple Git toolchain
        run: |
          env -i \
            HOME="$HOME" \
            USER="$USER" \
            LOGNAME="$LOGNAME" \
            TMPDIR="$RUNNER_TEMP/" \
            LANG="en_US.UTF-8" \
            PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
            HACHIMI_GIT_EXECUTABLE="/usr/bin/git" \
            target/debug/bundle/macos/Hachimi.app/Contents/MacOS/hachimi-desktop \
            --system-runtime-smoke

  ci-gate:
    name: CI
    if: ${{ always() }}
    needs:
      [
        "windows-static",
        "windows-rust",
        "windows-ui",
        "windows-desktop",
        "windows-non-admin",
        "macos",
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          optional = set([])
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
              and not (name in optional and job["result"] == "skipped")
          }
          if failed:
              print(f"Required CI jobs did not succeed: {failed}")
              sys.exit(1)
          print("All mandatory CI jobs passed.")
          PY
