name: Windows Release Gate
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
  build-candidate:
    needs: source-ci
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify clean versioned source
        run: |
          pnpm release:check-clean
          pnpm release:version-check
      - name: Build one immutable candidate set on the hosted runner
        shell: powershell
        run: |
          pnpm build:installer
          if ($LASTEXITCODE -ne 0) { throw "installer_build_failed" }
          pnpm build:portable
          if ($LASTEXITCODE -ne 0) { throw "portable_build_failed" }
          New-Item -ItemType Directory -Path target/release-candidate -Force | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe target/release-candidate/
          Copy-Item target/release/bundle/msi/*.msi target/release-candidate/
          Copy-Item target/portable/*.zip target/release-candidate/
          pnpm release:artifact-manifest -- target/release-candidate
          if ($LASTEXITCODE -ne 0) { throw "candidate_manifest_failed" }
          pnpm release:artifact-verify -- --root target/release-candidate --expected-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "candidate_verification_failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: hachimi-release-candidate-${{ github.run_id }}
          path: target/release-candidate/*
          if-no-files-found: error
          retention-days: 30
  release-gate:
    name: Release CI
    if: always()
    needs: [source-ci, build-candidate]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          failed = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Hosted candidate acceptance failed: {failed}")
          print("Full hosted source and desktop E2E plus immutable packages passed.")
          print("Installation identities, signed browser identities and external providers require independent environment acceptance.")
