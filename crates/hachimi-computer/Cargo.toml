[package]
name = "hachimi-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hachimi-core.workspace = true
hachimi-protocol.workspace = true
hachimi-process-policy.workspace = true
base64.workspace = true
parking_lot.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture.workspace = true
windows = { workspace = true, features = [
  "Graphics_Capture",
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDictionary",
  "NSGeometry",
  "NSProcessInfo",
  "NSString",
  "NSURL",
] }
objc2-app-kit = { workspace = true, features = [
  "NSBitmapImageRep",
  "NSImage",
  "NSRunningApplication",
  "NSWorkspace",
  "NSApplication",
  "NSWindow",
  "NSView",
  "NSControl",
  "NSTextField",
] }
objc2-core-graphics.workspace = true
block2.workspace = true
objc2-screen-capture-kit = { workspace = true, features = ["SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "objc2-core-foundation", "objc2-core-graphics"] }
core-graphics.workspace = true
core-foundation.workspace = true
libc.workspace = true
